#town weapons (weapons that are in the time period of Itzushi Project)

- type: entity
  name: SAT SM5
  parent: [ BaseItem, BaseWeaponRifle ]
  id: WeaponSMGswatMP5ItzushiBF14Town
  description: A compact submachine gun perfered by the special assault teams of Zero company. excels in both CQB and mid range combat.
  components:
  - type: Item
    sprite: _BF14/SMG/MP5.rsi
  - type: Clothing
    sprite: _BF14/SMG/MP5.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _BF14/SMG/MP5.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"] #bug with the smg mag in sprite not going away.
  - type: Gun
    fireRate: 10
    minAngle: 15
    maxAngle: 30
    angleIncrease: 5
    angleDecay: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    - Burst
  - type: GunRequiresWield
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: StaticPrice
    price: 100

