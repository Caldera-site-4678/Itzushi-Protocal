- type: entity
  parent: [ MobElementalBase, MobCombat ]
  id: BaseMobMonsterGhostGrounded
  name: Ghost
  abstract: true
  description: A ghost treading along the ground.
  components:
  - type: NpcFactionMember
    factions:
    - NpcFactionLostSouls

  - type: HTN
    rootTask:
      task: SimpleHostileCompound

  # FloatVisual
  - type: FloatBobVisuals
    amplitude: 0.15 # distance of bobbing
    frequency: 0.5 # cycle speed

  - type: Sprite
    drawdepth: Mobs
    state: alive
    color: "#FFFFFFB3"

  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 2

  - type: MeleeWeapon
    attackRate: 0.5
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Structural: 150
        Slash: 20
        Blunt: 20
        Heat: 20
        Piercing: 20
        Radiation: 10

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialObjectLifeEssenceStack1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

#MARK: Alpha Teke teke
- type: entity
  parent: BaseMobMonsterGhostGrounded
  id: MobMonsterAlphaTekeTeke
  name: Teke teke
  description: The vengeful ghost of a woman's upper half crawling on the ground, haunting urban areas and roads.
