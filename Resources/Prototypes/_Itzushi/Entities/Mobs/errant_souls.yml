#MARK: Rattle
- type: entity
  parent: BaseMobMonsterErrantSoulGrounded
  id: MobMonsterErrantSoulRattle
  name: rattle errant soul
  description: A soul that strayed too far from the path or was stuck too long in limbo...formally a Spetsnaz with enough cognition left to fill your belly full of lead.
  components:
  - type: Sprite
    layers:
    - sprite: _Itzushi/Mobs/ErrantSouls/errant_soul_rattle.rsi
      state: alive
      color: "#FFFFFFB3"

  - type: MovementSpeedModifier
    baseWalkSpeed: 0.6
    baseSprintSpeed: 0.6

  # override the base melee AI with ranged hostile AI
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound

  # ~100 boolets, then 1 boolet every 0.75 seconds
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75

  - type: BasicEntityAmmoProvider
    proto: BulletLightRifle
    capacity: 100
    count: 100

  - type: Gun
    fireRate: 8
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 20
    maxAngle: 60
    angleIncrease: 10
    angleDecay: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg

  # weak melee backup...dobut it will be needed now though
  - type: MeleeWeapon
    attackRate: 0.5
    damage:
      types:
        Blunt: 5

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialObjectLifeEssenceStack1:
            min: 2
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
