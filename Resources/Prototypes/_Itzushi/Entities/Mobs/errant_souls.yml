#MARK: Base
- type: entity
  parent: [ MobElementalBase, MobCombat ]
  id: BaseMobMonsterErrantSoul
  name: errant soul
  abstract: true
  description: A soul that strayed too far from the path or was stuck too long in limbo, now roaming in search of your life essence, at all costs.
  components:
  - type: NpcFactionMember
    factions:
    - NpcFactionLostSouls

  - type: HTN
    rootTask:
      task: SimpleHostileCompound

  # SCRAPPED using AlwaysWeightless component; forces errant souls to fucking ignore gravity cuz FUCK gravity
  # - type: AlwaysWeightless

  # SCRAPPED using AlwaysWeightless component; lets them move while weightless cuz they a ghost
  # - type: CanMoveInAir

  # SCRAPPED using AlwaysWeightless component; lets them move freely in weightless movement instead of needing to push off walls like a greytide retard who
  # forgot to grab a fire extinguisher roundstart
  # - type: MovementAlwaysTouching

  # FloatVisual; clientside bobbing effect...honestly the weightless component might not be needed... -pierow
  - type: FloatBobVisuals
    amplitude: 0.15 # distance of bobbing
    frequency: 0.5 # cycle speed

  - type: Sprite
    drawdepth: Mobs
    state: alive
    color: "#FFFFFFB3" # 30% transparency, makes em look ghostly

  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 2
    # weightlessWalkSpeed: 1
    # weightlessSprintSpeed: 2

  - type: MeleeWeapon
    attackRate: 0.5
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Structural: 150
        Slash: 20
        Blunt: 20
        Heat: 20
        Piercing: 20
        Radiation: 10

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialObjectLifeEssenceStack1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

